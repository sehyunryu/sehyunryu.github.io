name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm build

      - name: Export static homepage
        run: |
          pnpm start --port 3100 > /tmp/portfolio-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3100/ --output /tmp/home.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/home.html
          mkdir -p dist/client/my-vision dist/client/my-learnings
          cp /tmp/home.html dist/client/index.html
          curl --fail --silent http://localhost:3100/my-vision --output dist/client/my-vision/index.html
          curl --fail --silent http://localhost:3100/my-learnings --output dist/client/my-learnings/index.html
          find dist/client -name index.html -exec perl -0pi -e 's#<script\b[^>]*>.*?</script>##gs' {} +
          kill "$SERVER_PID"
          touch dist/client/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
